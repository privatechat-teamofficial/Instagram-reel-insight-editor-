name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        id: prepare_apk
        run: |
          mkdir -p ./release-assets
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          TARGET_NAME="Reel-Insights-Editor-v1.0.${{ github.run_number }}.apk"
          cp "$APK_PATH" "./release-assets/$TARGET_NAME"
          cp "$APK_PATH" "./release-assets/Reel-Insights-Editor-latest.apk"
          echo "apk_path=./release-assets/$TARGET_NAME" >> $GITHUB_OUTPUT
          echo "APK created at: ./release-assets/$TARGET_NAME"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reel-Insights-Editor-APK
          path: ./release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK in Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Reel Insights Editor v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Reel Insights Editor APK Release
            
            Automated build from commit: `${{ github.sha }}`
            
            ### ✨ What's Included:
            - Pixel-perfect Instagram Reel Insights replica
            - Interactive live metric and chart editing
            - Audience demographics & custom country name editor
            - Clean screenshot export & media upload
            
            ### ⬇️ Download:
            Download and install the `.apk` file below on your Android device.
          files: |
            ./release-assets/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
