name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21 (Required for Capacitor 8 & Gradle 8.14)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Signed Android Debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify & Prepare Installable APK Assets
        id: prepare_apk
        run: |
          mkdir -p ./release-assets
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Error: APK file not found in build outputs!"
            exit 1
          fi
          
          RUN_NUM="${{ github.run_number }}"
          TARGET_VERSIONED="Reel-Insights-Editor-v1.0.${RUN_NUM}.apk"
          TARGET_LATEST="Reel-Insights-Editor-latest.apk"
          
          cp "$APK_PATH" "./release-assets/$TARGET_VERSIONED"
          cp "$APK_PATH" "./release-assets/$TARGET_LATEST"
          
          echo "=========================================="
          echo "✅ Installable APK successfully generated:"
          ls -lh ./release-assets/
          echo "=========================================="
          echo "apk_path=./release-assets/$TARGET_VERSIONED" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reel-Insights-Editor-APK
          path: ./release-assets/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release with APK in Assets
        uses: softprops/action-gh-release@v2
        if: success()
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Reel Insights Editor v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Reel Insights Editor Android APK

            Automated installable build from commit: `${{ github.sha }}`

            ### ✨ App Features:
            - Pixel-perfect Instagram Reel Insights replication
            - Interactive live metric editing (tap any number or chart)
            - Country demographics, retention graphs & watch time
            - Clean screenshot export & media upload
            - Android full-screen native experience

            ### 📲 Installation Instructions:
            1. Download **`Reel-Insights-Editor-latest.apk`** below to your Android device.
            2. Tap the downloaded `.apk` file to start installation.
            3. If Android prompts *"Install unknown apps"*, tap **Allow from this source**.
            4. If Google Play Protect shows *"Unrecognized app"*, tap **More details** ➔ **Install anyway**.
            5. Launch **Reel Insights Editor**!
          files: |
            ./release-assets/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
